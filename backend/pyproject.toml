[project]
name = "repopilot-backend"
version = "0.1.0"
description = "RepoPilot's local-first FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
