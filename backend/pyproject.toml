[project]
name = "repopilot-backend"
version = "0.1.0"
description = "RepoPilot's local-first FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain==1.4.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
